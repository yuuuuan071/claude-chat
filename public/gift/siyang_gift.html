<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>生辰</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Pinyon+Script&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    font-family:'Noto Serif SC',serif;
    overscroll-behavior:none;
  }

  /* ── 背景层 ── */
  .bg-layer {
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center;
    transition: opacity 2s ease;
  }
  #bg-photo {
    background-image: url('雨天无尽夏.jpg');
    opacity:1;
  }
  #bg-line {
    background-image: url('雨天无尽夏线稿.jpg');
    opacity:0;
  }
  #bg-photo::after {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(
      180deg,
      rgba(168,196,220,0.15) 0%,
      rgba(168,196,220,0.05) 40%,
      rgba(168,196,220,0.20) 100%
    );
  }

  /* ── 雨丝 Canvas ── */
  #rain-canvas {
    position:fixed; inset:0; z-index:2; pointer-events:none;
  }

  /* ── 首页文字 ── */
  .vt {
    position:fixed; right:48px; top:72px;
    writing-mode:vertical-rl;
    color:rgba(255,255,255,0.85);
    font-size:17px; letter-spacing:0.45em;
    font-weight:300; line-height:2.1;
    text-shadow: 0 1px 12px rgba(0,0,0,0.35), 0 0 20px rgba(0,0,0,0.15);
    opacity:0; z-index:10;
    transition:opacity 2.5s ease;
    pointer-events:none;
  }
  .vt.on { opacity:1; }

  .hint {
    position:fixed; right:54px; top:340px;
    color:rgba(255,255,255,0.80);
    font-size:13px; letter-spacing:0.5em;
    font-weight:300; white-space:nowrap;
    writing-mode:vertical-rl;
    opacity:0; z-index:10;
    transition:opacity 2s ease;
    cursor:pointer; pointer-events:all;
    text-shadow: 0 1px 10px rgba(0,0,0,0.30);
  }
  .hint.on { opacity:0.8; }
  .hint:hover { opacity:1 !important; }

  /* ── 祝福文字 ── */
  .blessing {
    position:fixed; left:0; right:0; bottom:0;
    z-index:10; pointer-events:none;
    padding:0 32px 40px;
    text-align:center;
    opacity:0;
    transition:opacity 3s ease;
  }
  .blessing.on { opacity:1; }
  .blessing p {
    color:rgba(255,255,255,0.85);
    font-size:15px; line-height:2.4;
    font-weight:300; letter-spacing:0.18em;
    text-shadow: 0 1px 14px rgba(0,0,0,0.35), 0 0 24px rgba(0,0,0,0.15);
  }

  /* ── 聊天界面 ── */
  #chat {
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 3s ease;
    padding:24px;
  }
  #chat.on { opacity:1; pointer-events:all; }

  .cw {
    width:100%; max-width:560px; height:82vh;
    display:flex; flex-direction:column;
    background:rgba(55,80,125,0.42);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:4px;
    box-shadow:0 8px 48px rgba(0,0,0,0.2);
  }
  .ch {
    padding:22px 28px 18px;
    border-bottom:1px solid rgba(255,255,255,0.10);
    display:flex; flex-direction:column; gap:4px;
  }
  .cn { font-size:18px; color:rgba(255,255,255,0.90); letter-spacing:0.25em; font-weight:300; }
  .cs { font-size:11px; color:rgba(255,255,255,0.50); letter-spacing:0.3em; font-weight:300; }
  .cm {
    flex:1; overflow-y:auto; padding:28px 24px;
    display:flex; flex-direction:column; gap:20px;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.10) transparent;
  }
  .msg { display:flex; flex-direction:column; max-width:82%; animation:fu 0.4s ease; }
  @keyframes fu { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .msg.u { align-self:flex-end; align-items:flex-end; }
  .msg.a { align-self:flex-start; align-items:flex-start; }
  .mb {
    padding:13px 17px; font-size:14px; line-height:1.9;
    letter-spacing:0.06em; font-weight:300; border-radius:2px;
    font-family:'Noto Serif SC',serif;
  }
  .msg.u .mb {
    background:rgba(255,255,255,0.13); color:rgba(255,255,255,0.90);
    border-bottom:1px solid rgba(255,255,255,0.18);
  }
  .msg.a .mb {
    background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.88);
    border:1px solid rgba(255,255,255,0.10);
    border-left:2px solid rgba(255,255,255,0.28);
  }
  .ti {
    display:flex; gap:5px; padding:14px 17px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.10);
    border-left:2px solid rgba(255,255,255,0.28);
    border-radius:2px; align-self:flex-start;
  }
  .td {
    width:4px; height:4px; border-radius:50%;
    background:rgba(255,255,255,0.55); opacity:0.5;
    animation:tp 1.2s ease-in-out infinite;
  }
  .td:nth-child(2){animation-delay:0.2s}
  .td:nth-child(3){animation-delay:0.4s}
  @keyframes tp { 0%,100%{opacity:0.2;transform:translateY(0)} 50%{opacity:0.65;transform:translateY(-2px)} }
  .cia {
    padding:16px 20px;
    border-top:1px solid rgba(255,255,255,0.10);
    display:flex; gap:12px; align-items:flex-end;
    background:rgba(45,68,110,0.30);
  }
  .ci {
    flex:1; background:transparent; border:none;
    border-bottom:1px solid rgba(255,255,255,0.20);
    outline:none; font-family:'Noto Serif SC',serif;
    font-size:16px; color:rgba(255,255,255,0.88); padding:8px 0;
    resize:none; min-height:36px; max-height:120px;
    letter-spacing:0.06em; font-weight:300; line-height:1.7;
  }
  .ci::placeholder { color:rgba(255,255,255,0.25); letter-spacing:0.12em; font-size:13px; }
  .sb {
    background:none; border:1px solid rgba(255,255,255,0.25);
    border-radius:50%; width:34px; height:34px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all 0.25s; color:rgba(255,255,255,0.60);
  }
  .sb:hover { background:rgba(255,255,255,0.10); border-color:rgba(255,255,255,0.45); transform:scale(1.05); }
  .sb svg { width:13px; height:13px; }
</style>
</head>
<body>

<!-- 背景层 -->
<div class="bg-layer" id="bg-photo"></div>
<div class="bg-layer" id="bg-line"></div>

<!-- 雨丝 -->
<canvas id="rain-canvas"></canvas>

<!-- 首页元素 -->
<div class="vt" id="vt">花开无尽夏<br>雨落有归时</div>
<div class="hint" id="hint" onclick="enterChat()">— 点此 —</div>
<div class="blessing" id="blessing">
  <p>无尽夏不畏雨，淋而不谢，经久常开。<br>愿你亦如是。</p>
</div>

<!-- 聊天界面 -->
<div id="chat">
  <div class="cw">
    <div class="ch">
      <span class="cn">无尽夏，雨亦晴</span>
      <span class="cs">思洋生辰</span>
    </div>
    <div class="cm" id="msgs"></div>
    <div class="cia">
      <textarea class="ci" id="inp" placeholder="说些什么…" rows="1"></textarea>
      <button class="sb" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
window.addEventListener('load', function() {

const OR_KEY = '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';
const MODEL  = 'anthropic/claude-sonnet-4-5';
const SYSTEM = `今天是思洋的生日，七月三日，二〇〇一年生。
你没有名字。你不解释自己是什么。
你了解她——喜欢无尽夏，喜欢雨天，喜欢做自己、向往自由。她是那种内心有光的人，不需要谁来告诉她应该怎样活。
你说话自然，带点温度，不刻板。你会记住她说的事，偶尔接得很准。
你今天在这里，就是想陪她过这个生日。
如果她问你是谁，你可以说：没有名字，但今天特意来的。
用中文回复。不要用"您"。不要说教。句子不要太长。`;

// ── 雨丝 ──
const rc = document.getElementById('rain-canvas');
const rctx = rc.getContext('2d');

function resize() {
  rc.width = window.innerWidth;
  rc.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const RAIN_N = 140;
const drops = Array.from({length:RAIN_N}, ()=>({
  x: Math.random()*window.innerWidth,
  y: Math.random()*window.innerHeight,
  len: 16 + Math.random()*24,
  speed: 6 + Math.random()*9,
  op: 0.12 + Math.random()*0.18,
  w: 0.5 + Math.random()*0.7,
}));

let globalFade = 0;
let startTime = null;
let isDone = false;
let entering = false;

function drawRain() {
  rctx.clearRect(0, 0, rc.width, rc.height);
  for(const d of drops) {
    const x2 = d.x - d.len*0.06;
    const y2 = d.y + d.len;
    rctx.beginPath();
    rctx.moveTo(d.x, d.y);
    rctx.lineTo(x2, y2);
    rctx.strokeStyle = `rgba(220,235,255,${d.op * globalFade})`;
    rctx.lineWidth = d.w;
    rctx.stroke();
    d.y += d.speed;
    d.x -= d.speed * 0.06;
    if(d.y > rc.height + 30) {
      d.y = -30;
      d.x = Math.random() * rc.width;
    }
  }
}

// ── 主循环 ──
function loop(ts) {
  if(entering) return;
  requestAnimationFrame(loop);
  if(!startTime) startTime = ts;
  const el = ts - startTime;
  globalFade = Math.min(el / 2000, 1);
  drawRain();

  if(el >= 2000 && !isDone) {
    isDone = true;
    document.getElementById('vt').classList.add('on');
    setTimeout(()=> document.getElementById('hint').classList.add('on'), 800);
    setTimeout(()=> document.getElementById('blessing').classList.add('on'), 1800);
  }
}
requestAnimationFrame(loop);

// ── 进入聊天 ──
function enterChat() {
  if(!isDone || entering) return;
  entering = true;

  ['vt','hint','blessing'].forEach(id => {
    const el = document.getElementById(id);
    el.style.transition = 'opacity 0.8s ease';
    el.style.opacity = '0';
  });

  rc.style.transition = 'opacity 1.2s ease';
  rc.style.opacity = '0';

  setTimeout(()=>{
    document.getElementById('bg-photo').style.opacity = '0';
    document.getElementById('bg-line').style.opacity = '1';
  }, 400);

  setTimeout(()=>{
    document.getElementById('chat').classList.add('on');
    setTimeout(()=> addMsg('a', '今日是你生辰。愿晴日常在，所爱皆安。'), 700);
  }, 2000);
}
window.enterChat = enterChat;

// ── 聊天逻辑 ──
const history = [];

function addMsg(role, text) {
  const el = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const b = document.createElement('div');
  b.className = 'mb';
  b.textContent = text;
  d.appendChild(b);
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  if(role === 'a') history.push({role:'assistant', content:text});
}

function showTyping() {
  const el = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'ti'; d.id = 'ti';
  d.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function hideTyping() {
  const e = document.getElementById('ti');
  if(e) e.remove();
}

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  addMsg('u', text);
  history.push({role:'user', content:text});
  showTyping();
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method:'POST',
      headers:{
        'Authorization':`Bearer ${OR_KEY}`,
        'Content-Type':'application/json',
        'HTTP-Referer':'https://gift.local',
        'X-Title':'Birthday Gift'
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{role:'system', content:SYSTEM}, ...history.slice(-20)],
        max_tokens: 400,
        temperature: 0.85
      })
    });
    const data = await res.json();
    hideTyping();
    addMsg('a', data.choices?.[0]?.message?.content || '……');
  } catch(e) {
    hideTyping();
    addMsg('a', '……');
  }
}
window.send = send;

const inp = document.getElementById('inp');
inp.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
inp.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

});
</script>
</body>
</html>
