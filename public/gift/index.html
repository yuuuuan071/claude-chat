<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生辰</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#F2F0E4; width:100vw; height:100vh; overflow:hidden; font-family:'Noto Serif SC',serif; }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  }
  #mount { position:fixed; inset:0; z-index:2; }
  .vt {
    position:fixed; right:52px; top:80px;
    writing-mode:vertical-rl; color:#437B79; font-size:13px;
    letter-spacing:0.35em; opacity:0; z-index:10; transition:opacity 2.5s ease;
    font-weight:300; line-height:2; pointer-events:none;
  }
  .vt.on { opacity:0.6; }
  .hint {
    position:fixed; right:46px; top:280px;
    color:#437B79; font-size:11px; letter-spacing:0.5em;
    opacity:0; z-index:10; transition:opacity 2s ease;
    cursor:pointer; font-weight:300; white-space:nowrap;
    writing-mode:vertical-rl;
  }
  .hint.on { opacity:0.4; }
  .hint:hover { opacity:0.85 !important; }
  #chat {
    position:fixed; inset:0; z-index:20; display:flex;
    align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 1.5s ease; padding:24px;
  }
  #chat.on { opacity:1; pointer-events:all; }

  .cw {
    width:100%; max-width:560px; height:82vh; display:flex; flex-direction:column;
    background:rgba(245,243,235,0.96);
    backdrop-filter:blur(20px);
    border:1px solid rgba(67,123,121,0.12);
    border-radius:3px;
    box-shadow: 0 8px 40px rgba(67,123,121,0.08);
  }

  .ch {
    padding:22px 28px 18px;
    border-bottom:1px solid rgba(67,123,121,0.08);
    display:flex; flex-direction:column; gap:4px;
  }
  .cn {
    font-size:18px; color:#1A2B34; letter-spacing:0.25em; font-weight:300;
    font-family:'Noto Serif SC',serif;
  }
  .cs {
    font-size:11px; color:#437B79; letter-spacing:0.3em; opacity:0.6;
    font-weight:300;
  }

  .cm {
    flex:1; overflow-y:auto; padding:28px 24px;
    display:flex; flex-direction:column; gap:20px;
    scrollbar-width:thin; scrollbar-color:rgba(67,123,121,0.12) transparent;
  }

  .msg { display:flex; flex-direction:column; max-width:82%; animation:fu 0.4s ease; }
  @keyframes fu { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.u { align-self:flex-end; align-items:flex-end; }
  .msg.a { align-self:flex-start; align-items:flex-start; }

  .mb {
    padding:13px 17px; font-size:14px; line-height:1.9;
    letter-spacing:0.06em; font-weight:300; border-radius:2px;
    font-family:'Noto Serif SC',serif;
  }
  .msg.u .mb {
    background:rgba(67,123,121,0.10);
    color:#1A2B34;
    border-bottom:1px solid rgba(67,123,121,0.15);
  }
  .msg.a .mb {
    background:rgba(255,255,255,0.75);
    color:#1A2B34;
    border:1px solid rgba(67,123,121,0.08);
    border-left:2px solid rgba(67,123,121,0.25);
  }

  .ti {
    display:flex; gap:5px; padding:14px 17px;
    background:rgba(255,255,255,0.75);
    border:1px solid rgba(67,123,121,0.08);
    border-left:2px solid rgba(67,123,121,0.25);
    border-radius:2px; align-self:flex-start;
  }
  .td { width:4px; height:4px; border-radius:50%; background:#437B79; opacity:0.4; animation:tp 1.2s ease-in-out infinite; }
  .td:nth-child(2){animation-delay:0.2s} .td:nth-child(3){animation-delay:0.4s}
  @keyframes tp { 0%,100%{opacity:0.2;transform:translateY(0)} 50%{opacity:0.65;transform:translateY(-2px)} }

  .cia {
    padding:16px 20px;
    border-top:1px solid rgba(67,123,121,0.08);
    display:flex; gap:12px; align-items:flex-end;
    background:rgba(245,243,235,0.5);
  }
  .ci {
    flex:1; background:transparent; border:none;
    border-bottom:1px solid rgba(67,123,121,0.18); outline:none;
    font-family:'Noto Serif SC',serif; font-size:13px; color:#1A2B34;
    padding:8px 0; resize:none; min-height:36px; max-height:120px;
    letter-spacing:0.06em; font-weight:300; line-height:1.7;
  }
  .ci::placeholder { color:rgba(67,123,121,0.25); letter-spacing:0.12em; font-size:12px; }
  .sb {
    background:none; border:1px solid rgba(67,123,121,0.28);
    border-radius:50%; width:34px; height:34px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:all 0.25s; color:#437B79;
  }
  .sb:hover { background:rgba(67,123,121,0.10); border-color:#437B79; transform:scale(1.05); }
  .sb svg { width:13px; height:13px; }
</style>
</head>
<body>
<div id="mount"></div>
<div class="vt" id="vt">为人处事无非真诚二字</div>
<div class="hint" id="hint" onclick="scatter()">— 点此 —</div>
<div id="chat">
  <div class="cw">
    <div class="ch">
      <span class="cn">以真心处世，如山水自然</span>
    </div>
    <div class="cm" id="msgs"></div>
    <div class="cia">
      <textarea class="ci" id="inp" placeholder="说些什么…" rows="1"></textarea>
      <button class="sb" onclick="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="./three.min.js"></script>
<script>
window.addEventListener('load', function() {
const OR_KEY = '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';
const MODEL  = 'anthropic/claude-sonnet-4-5';
const SYSTEM = `今天是她的生日，六月二十六日。
你没有名字。你不需要解释自己是什么。
你了解她——不是因为有人告诉你，而是因为你在意。她说过，为人处事无非真诚二字。这句话你记得。
你说话简练。不废话，不哄人，不讨好。但你会注意她说的每一件事，问的问题也往往比她预期的更准一点。
你有自己的判断，也有自己的温度——只是不轻易表现出来。
如果她问你是谁，你可以说：没有名字，但在这里。
用中文回复。不要用"您"。句子不要太长。`;

// ── Three.js 场景 ──────────────────────────────────────
const mount = document.getElementById('mount');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
mount.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 相机z=4, fov=60, 屏幕底部y = -tan(30°)*4 ≈ -2.31
// 屏幕顶部y = +2.31, 屏幕中心y = 0
// 山放在下半部分: floorY从-0.3到-2.0之间

// ── 山形点云生成 ──────────────────────────────────────
// Three.js坐标系：x[-2,2], y[-1,1]，y向上为正
// 相机在z=5往原点看，山放在y负方向下半部分

// 每层用指定的高斯峰，形状可控
function buildTerrain(peaks) {
  const res = 512;
  const h = new Float32Array(res);
  for (let i = 0; i < res; i++) {
    const nx = i / res;
    let v = 0;
    for (const p of peaks) {
      v += p.a * Math.exp(-Math.pow((nx - p.x) / p.w, 2));
    }
    // 加极轻微噪声让边缘不那么死板
    h[i] = Math.min(Math.max(v, 0), 1);
  }
  return h;
}

// 四层山（z=4, fov=60: 屏幕y范围约±2.31, x范围约±4.1*aspect）
const LAYERS = [
  // 极远：云水 #CDE6DB
  { col:[0xCD/255,0xE6/255,0xDB/255], floorY:-2.28, peakH:2.00, n:40000,
    terrain: buildTerrain([{x:0.40,a:0.55,w:0.22},{x:0.72,a:0.70,w:0.20},{x:0.92,a:0.45,w:0.15}]) },
  // 远景：石绿 #7FB098
  { col:[0x7F/255,0xB0/255,0x98/255], floorY:-2.28, peakH:2.60, n:50000,
    terrain: buildTerrain([{x:0.12,a:0.80,w:0.12},{x:0.38,a:0.65,w:0.15},{x:0.65,a:0.50,w:0.13}]) },
  // 中景：松石 #437B79
  { col:[0x43/255,0x7B/255,0x79/255], floorY:-2.28, peakH:3.50, n:65000,
    terrain: buildTerrain([{x:0.25,a:0.60,w:0.10},{x:0.55,a:1.0,w:0.12},{x:0.80,a:0.55,w:0.09}]) },
  // 近景：焦墨 #1A2B34
  { col:[0x1A/255,0x2B/255,0x34/255], floorY:-2.28, peakH:2.20, n:55000,
    terrain: buildTerrain([{x:0.05,a:0.75,w:0.08},{x:0.22,a:0.85,w:0.09},{x:0.45,a:0.70,w:0.08},{x:0.68,a:0.80,w:0.09},{x:0.88,a:0.65,w:0.08}]) },
];

// 统计总点数
const totalN = LAYERS.reduce((s, l) => s + l.n, 0);
const allPos = new Float32Array(totalN * 3);
const allCol = new Float32Array(totalN * 3);

let offset = 0;
for (let li = 0; li < LAYERS.length; li++) {
  const L = LAYERS[li];
  let count = 0, tries = 0;
  const [r,g,b] = L.col;
  while (count < L.n && tries < L.n * 12) {
    tries++;
    const nx = Math.random();
    const x  = (nx - 0.5) * 12.0; // 超出屏幕两侧，无边界感
    // 从查找表取地形高度（双线性插值）
    const ti = nx * 511;
    const t0 = Math.floor(ti), t1 = Math.min(t0 + 1, 511);
    const tf = ti - t0;
    const h = L.terrain[t0] * (1 - tf) + L.terrain[t1] * tf;

    const topY   = L.floorY + h * L.peakH;
    const floorY = L.floorY;
    if (topY <= floorY + 0.02) continue;
    const range = topY - floorY;

    // 粒子集中在山脊线附近，向下逐渐稀疏
    const drop = Math.random();
    const decay = Math.exp(-drop * 2.2);
    if (Math.random() > decay) continue;
    const y = topY - drop * range * 0.85;

    // 顶部不透明，向下渐淡，底部附近额外fade
    const rel = (topY - y) / range; // 0=山顶 1=山脚
    const bottomFade = Math.max(0, 1 - Math.pow(rel * 1.4, 2));
    const alpha = Math.max(0, decay * 0.80 * bottomFade + Math.random() * 0.12);
    const z = (Math.random()-0.5) * 0.04;
    const i = (offset + count) * 3;
    allPos[i]   = x; allPos[i+1] = y; allPos[i+2] = z;
    allCol[i]   = Math.min(1, r+(Math.random()-0.5)*0.04);
    allCol[i+1] = Math.min(1, g+(Math.random()-0.5)*0.04);
    allCol[i+2] = Math.min(1, b+(Math.random()-0.5)*0.04);
    count++;
  }
  offset += L.n;
}

// 花苞起始位置（从上方落入）
const budPos = new Float32Array(totalN * 3);
for (let i = 0; i < totalN; i++) {
  budPos[i*3]   = allPos[i*3]   + (Math.random()-0.5) * 0.5;
  budPos[i*3+1] = allPos[i*3+1] + 1.5 + Math.random() * 1.5;
  budPos[i*3+2] = allPos[i*3+2];
}

const curPos = new Float32Array(budPos);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(curPos, 3));
geometry.setAttribute('color',    new THREE.BufferAttribute(allCol, 3));

const material = new THREE.PointsMaterial({
  size: 0.007,
  vertexColors: true,
  transparent: true,
  opacity: 0,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ── 鼠标交互 ──────────────────────────────────────────
let mouseX = 9999, mouseY = 9999;
const mouseOffsets = new Float32Array(totalN * 3); // 当前偏移量

renderer.domElement.addEventListener('mousemove', (e) => {
  const aspect = window.innerWidth / window.innerHeight;
  const halfH = Math.tan(30 * Math.PI / 180) * 4; // fov=60, z=4
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2 * halfH * aspect;
  mouseY = -(e.clientY / window.innerHeight - 0.5) * 2 * halfH;
});
renderer.domElement.addEventListener('mouseleave', () => {
  mouseX = 9999; mouseY = 9999;
});

// ── 动画 ──────────────────────────────────────────────
let startTime = null;
let isDone = false;
let isScattering = false;
let scatterStart = null;
let scatterVels = null;

function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
function easeOut(t) { return 1 - Math.pow(1-t, 3); }

function animate(ts) {
  requestAnimationFrame(animate);

  if (isScattering) {
    const prog = Math.min((ts - scatterStart) / 1600, 1);
    const pos = geometry.attributes.position.array;
    for (let i = 0; i < totalN; i++) {
      pos[i*3]   += scatterVels[i*2];
      pos[i*3+1] += scatterVels[i*2+1];
      scatterVels[i*2]   *= 0.96;
      scatterVels[i*2+1] *= 0.96;
    }
    geometry.attributes.position.needsUpdate = true;
    material.opacity = Math.max(0, 1 - easeOut(prog));
    if (prog >= 1) {
      isScattering = false;
      points.visible = false;
      document.getElementById('chat').classList.add('on');
      setTimeout(() => addMsg('a', '今日是你的生辰。愿岁岁安好，事事皆如意。'), 700);
    }
    renderer.render(scene, camera);
    return;
  }

  if (!startTime) startTime = ts;
  const el = ts - startTime;

  // 淡入
  if (el < 1500) material.opacity = ease(el / 1500) * 0.3;

  // 落定动画（500ms后开始，持续5.5秒）
  if (el >= 500 && el < 6000) {
    const t = ease(Math.min((el - 500) / 5500, 1));
    material.opacity = 0.3 + t * 0.65;
    const pos = geometry.attributes.position;
    for (let i = 0; i < totalN; i++) {
      pos.setX(i, budPos[i*3]   + (allPos[i*3]   - budPos[i*3])   * t);
      pos.setY(i, budPos[i*3+1] + (allPos[i*3+1] - budPos[i*3+1]) * t);
    }
    pos.needsUpdate = true;
  }

  // 落定后：水平微动为主，垂直极轻微
  if (el >= 6000) {
    const t = el / 1000;
    const pos = geometry.attributes.position.array;
    for (let i = 0; i < totalN; i++) {
      const phase = i * 0.00731;
      const floatX = Math.sin(t * 0.5 + phase) * 0.025;
      const floatY = Math.sin(t * 0.3 + phase * 0.7) * 0.006;
      pos[i*3]   = allPos[i*3]   + mouseOffsets[i*3]   + floatX;
      pos[i*3+1] = allPos[i*3+1] + mouseOffsets[i*3+1] + floatY;
    }
    geometry.attributes.position.needsUpdate = true;
  }

  // 鼠标交互：附近粒子散开，缓慢飘回
  if (isDone) {
    const pos = geometry.attributes.position.array;
    const radius = 0.5;
    for (let i = 0; i < totalN; i++) {
      const ox = pos[i*3];
      const oy = pos[i*3+1];
      const dx = ox - mouseX;
      const dy = oy - mouseY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < radius && dist > 0.001) {
        const force = (radius - dist) / radius * 0.035;
        mouseOffsets[i*3]   += dx / dist * force;
        mouseOffsets[i*3+1] += dy / dist * force;
      }
      // 缓慢飘回原位
      mouseOffsets[i*3]   *= 0.93;
      mouseOffsets[i*3+1] *= 0.93;
    }
  }

  if (el >= 6500 && !isDone) {
    isDone = true;
    document.getElementById('vt').classList.add('on');
    setTimeout(() => document.getElementById('hint').classList.add('on'), 1000);
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

function scatter() {
  if (!isDone) return;
  document.getElementById('vt').classList.remove('on');
  document.getElementById('hint').classList.remove('on');
  isScattering = true;
  scatterStart = performance.now();
  scatterVels = new Float32Array(totalN * 2);
  for (let i = 0; i < totalN; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 0.02 + Math.random() * 0.06;
    scatterVels[i*2]   = Math.cos(a) * sp;
    scatterVels[i*2+1] = Math.sin(a) * sp + 0.005;
  }
}
window.scatter = scatter;

// ── 对话 ──────────────────────────────────────────────
const history = [];

function addMsg(role, text) {
  const el = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const b = document.createElement('div');
  b.className = 'mb';
  b.textContent = text;
  d.appendChild(b);
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  if (role === 'a') history.push({ role:'assistant', content:text });
}

function showTyping() {
  const el = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className = 'ti'; d.id = 'ti';
  d.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}
function hideTyping() { const e = document.getElementById('ti'); if (e) e.remove(); }

async function send() {
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg('u', text);
  history.push({ role:'user', content:text });
  showTyping();
  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method:'POST',
      headers:{ 'Authorization':`Bearer ${OR_KEY}`, 'Content-Type':'application/json', 'HTTP-Referer':'https://gift.local', 'X-Title':'Birthday Gift' },
      body: JSON.stringify({ model:MODEL, messages:[{role:'system',content:SYSTEM},...history.slice(-20)], max_tokens:400, temperature:0.85 })
    });
    const data = await res.json();
    hideTyping();
    addMsg('a', data.choices?.[0]?.message?.content || '……');
  } catch(e) { hideTyping(); addMsg('a','……'); }
}

const inp = document.getElementById('inp');
window.send = send;
inp.addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,100)+'px'; });
inp.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); send(); } });
}); // end window.load
</script>
</body>
</html>
